<!doctype html><html lang="en"><head><meta charset="utf-8"><title>AnonyHost - DarkWeb Hosting Tool</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="{{ url_for('static', filename='css/torhost.css') }}"></head>
<body><canvas id="stars" aria-hidden="true"></canvas>
<main style="margin:0 auto;display:grid;place-items:center;min-height:100vh;max-width:380px;padding:16px">
<form method="post" class="card" style="width:100%;text-align:center">
<img src="{{ url_for('static', filename='images/logo.png') }}" alt="AnonyHost" style="width:62%;mix-blend-mode:screen">
<div class="ttl" style="margin:4px 0 14px">AnonyHost</div>
{% for c,m in get_flashed_messages(with_categories=true) %}<div class="alert {{c}}">{{m}}</div>{% endfor %}
<input type="hidden" name="csrf" value="{{csrf}}">
<input class="field" name="username" placeholder="username" autofocus required autocomplete="username">
<input name="password" type="password" placeholder="admin password" autofocus required aria-label="Admin password"
 style="width:100%;margin-bottom:12px;padding:10px;border:1px solid var(--line);background:#000;color:var(--ok);font:inherit">
<button class="btn go" style="width:100%;justify-content:center">Sign in</button>
<p style="margin:14px 0 0"><a href="/recover" style="color:var(--cy)">Forgot password?</a></p>
</form></main>
<script src="{{ url_for('static', filename='js/stars.js') }}"></script>
<div class="author">Author: <a href="https://www.tca.ac.tz" target="_blank" rel="noopener noreferrer">www.tca.ac.tz</a></div>
</body></html>
